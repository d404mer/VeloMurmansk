<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Плашки кругов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/laps.css?v=13">
</head>

<body>
  <div id="plaque-stack">
    <div id="plaque-stack-inner">
      <div id="plaque-leader-slot"></div>
      <div id="plaque-followers">
        <div id="plaque-track"></div>
      </div>
    </div>
  </div>
  <div id="test-panel" class="test-panel hidden">
    <div id="lap-status" class="lap-status"></div>
    <button type="button" id="btn-random">+ случайная плашка</button>
    <button type="button" id="btn-sim-leader">+1 круг лидера (тест)</button>
    <button type="button" id="btn-replay">Replay отсечек</button>
    <button type="button" id="btn-clear">Очистить</button>
  </div>
  <script src="/js/laps.js?v=13"></script>
</body>

</html>
