<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" crossorigin="anonymous">



  </head>
  <body id="app" v-cloak>
    <div class="row">
      <div class='container'>
        <div class="col" >
        	<h1> EVVC  </h1>
        	<ul class="list-group"> 
            <div class='list-item-container'
              v-for="(item,index) in sheet1">
          		  <li  class="list-group-item"
                  v-on:click='clickItem( item, index )' 
                  v-bind:id = 'index'>

                <div class='number' style="width: 100%">
                 {{ index+1 }} </br>
                </div>
            		<div v-for="(athlet, index) in item" class="text" :key="index">
                  <div style="float: left; margin-right: 20px;">{{ athlet.result }}</div>
                  <div style="display: inline-block; text-align: center; margin-right: 20px;">{{ athlet.name }}</div>
                  <div style="float: left;margin-right: 50px;">{{ athlet.number }}</div>
                </div>
                <div 
                  class='countdown'
                  v-bind:id='index'>
                </div>
                <div 
                  class='progressbar'
                  v-bind:id='index'>
                </div>
          		</li>
             
            </div>
        	</ul>
        </div>
        <div style="height: 300px;">
        </div>
        <div class='footer'> 
            <button type="button" class="btn btn-primary" 
            v-on:click ='vmixCommand( "lider" )'> 
            LIDER </button>
            <button type="button" class="btn btn-primary" 
            v-on:click ='vmixCommand( "lider4" )'> 
            LIDER4 </button>
        </div>
      </div>

    </div>



  <script src="js/jquery.min.js"></script>
  <script type="text/javascript" type="text/javascript" src="js/bootstrap.min.js"> </script>
  <script type="text/javascript" type="text/javascript" src="js/axios.min.js"> </script>
  <script type="text/javascript" type="text/javascript" src="js/jquery-3.6.1.min.js"> </script>
  <script src="js/vue.global.js"></script>
  <script type="module" src="js/app.js"></script>

  </body>
  </html>
